
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carbon Footprint Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="text-center my-4">
    <h1>Carbon Footprint Calculator</h1>
  </header>

  <nav class="navbar nav-frame">
    <a class="nav-link active" href="#general">General</a>
    <a class="nav-link" href="#home">Home</a>
    <a class="nav-link" href="#travel">Travel</a>
    <a class="nav-link" href="#food">Food</a>
    <a class="nav-link" href="#electronic">Electronic usage</a>
    <a class="nav-link" href="#shopping">Shopping</a>
    <a class="nav-link" href="#result">Result</a>
    <a class="btn btn-success ms-auto" href="#general">Home</a>
  </nav>

  <main class="container-fluid">
    <div class="card calculator-card" id="general">
      <div class="card-header">Fill the form below</div>

      <div class="card-body">
        <form>
          <div class="row align-items-center mb-3">
            <label class="col-4" for="name">Name</label>
            <div class="col-8">
              <input class="form-control" id="name" type="text">
            </div>
          </div>

          <div class="row align-items-center mb-3">
            <label class="col-4" for="age">Age</label>
            <div class="col-8">
              <input class="form-control" id="age" type="number">
            </div>
          </div>

          <div class="row align-items-center">
            <label class="col-4" for="country">Country</label>
            <div class="col-8">
              <select class="form-select" id="country">
                <option selected>Saudi Arabia</option>
                <option>United Arab Emirates</option>
                <option>Egypt</option>
                <option>India</option>
                <option>United Kingdom</option>
                <option>United States</option>
                <option>Other</option>
              </select>
            </div>
          </div>
        </form>
      </div>

      <div class="card-footer text-center">
        <button class="btn btn-success" type="button"
          onclick="history.back()">Prev</button>
        <button class="btn btn-success" type="button"
          onclick="document.getElementById('message').textContent='Next section coming soon!'">Next</button>
      </div>
    </div>

    <p id="message" class="text-center mt-3"></p>
  </main>

</body>
</html>
